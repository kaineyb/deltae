[project]
name = "deltae"
version = "1.1.2"
description = "Deltae 2000 written in pure python. See README.md for more"
authors = [{ name = "Kaine Bruce", email = "kaineyb@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["color difference", "colour difference", "delta e"]

[project.urls]
Repository = "https://github.com/kaineyb/deltae"
Homepage = "https://pypi.org/project/deltae/"

[dependency-groups]
dev = ["pytest==8.1.1", "ruff>=0.6"]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.7,<0.8"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py39"
extend-exclude = ["README.md"]
